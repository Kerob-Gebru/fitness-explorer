<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        function isMetaMaskNoise(source, message) {
          var src = String(source || '');
          var msg = String(message || '');
          var fromExt =
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1;
          return fromExt && (msg.indexOf('MetaMask') !== -1 || src.indexOf('inpage.js') !== -1);
        }

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event.reason;
            if (isMetaMaskNoise(reason && (reason.stack || reason.filename), reason && (reason.message || reason))) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (event) {
            var err = event.error;
            if (isMetaMaskNoise(event.filename || (err && err.stack), event.message || (err && err.message))) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        var origError = console.error;
        console.error = function () {
          var parts = [];
          for (var i = 0; i < arguments.length; i += 1) {
            var arg = arguments[i];
            parts.push(arg && (arg.stack || arg.message) ? arg.stack || arg.message : String(arg || ''));
          }
          var joined = parts.join(' ');
          if (isMetaMaskNoise(joined, joined)) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0F13" />
    <meta name="description" content="Search exercises, see how to do them, and save your favorites." />
    <title>Fitness &amp; Workout Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Martian+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
